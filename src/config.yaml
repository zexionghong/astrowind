  googleSiteVerificationId: orcPxI47GSa-cRvY11tUe6iGg2IO_RPvnA1q95iEM3M
  bingSiteVerificationId: 8D799482CF9CE9E195F399D5BD19E2DC
  s360SiteVerificationId: f2330f13ce1669019105431474dad8dd
  baiduSiteVerificationId: codeva-DsczgTJKSi  # 百度站长 ipflexproxy.com

# Default SEO metadata
metadata:
  title:
    default: IPFlex - 全球领先的IP代理服务商 | 住宅代理 | HTTP代理 | SOCKS5代理
    template: '%s — IPFlex代理IP服务'
  description: "IPFlex专业提供企业级IP代理服务：静态住宅代理、动态住宅代理、数据中心代理。支持HTTP/SOCKS5协议，覆盖全球200+国家，服务网页抓取、跨境电商、广告验证、市场调研、SEO优化等场景。99.9%可用性保证，千万IP池资源，免费试用，24/7技术支持。立即体验高质量代理IP服务，助力业务增长！"
  robots:
    index: true
    follow: true
  openGraph:
    site_name: IPFlex
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@onwidget'
    site: '@onwidget'
    cardType: summary_large_image

i18n:
  languages: ['en', 'zh']
  defaultLanguage: zh
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6
  
    post:
      isEnabled: true
      permalink: '/blog/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: G-P98M0QPTW5 # or "G-XXXXXXXXXX"
      partytown: true
    googleAds:
      id: AW-17073122218
      partytown: true

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
